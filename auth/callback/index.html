<!doctype html>
<html>
  <head><meta charset="utf-8"><title>VoltWatch Sign-In</title></head>
  <body style="background:#000;color:#00E676;font-family:sans-serif;text-align:center;padding-top:40px;">
    <p>Returning to VoltWatch…</p>
    <a id="open" style="color:#fff;">Tap here if not redirected</a>
    <script>
      var target = "voltwatch://auth/callback" + window.location.search;
      document.getElementById("open").href = target;
      window.location.replace(target);
    </script>
  </body>
</html>
